app-id: org.haneoka.haneoka
runtime: org.gnome.Platform
runtime-version: '48'
sdk: org.gnome.Sdk
command: haneoka
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=home
  - --talk-name=org.freedesktop.secrets
modules:
  - name: haneoka
    buildsystem: simple
    build-commands:
      - install -d /app/share/haneoka /app/bin /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/mime/packages
      - cp -a bundle/. /app/share/haneoka/
      - install -m755 haneoka-launcher /app/bin/haneoka
      - install -m644 org.haneoka.haneoka.desktop /app/share/applications/
      - install -m644 org.haneoka.haneoka.xml /app/share/mime/packages/
      - install -m644 icon.png /app/share/icons/hicolor/512x512/apps/org.haneoka.haneoka.png
    sources:
      - type: dir
        path: ../../build/flatpak/bundle
        dest: bundle
      - type: file
        path: haneoka-launcher
      - type: file
        path: org.haneoka.haneoka.xml
      - type: file
        path: org.haneoka.haneoka.desktop
      - type: file
        path: ../../assets/brand/android-chrome-512x512.png
        dest-filename: icon.png
