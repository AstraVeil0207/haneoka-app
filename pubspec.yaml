name: haneoka
description: "Reads your Our Notes save on every platform and shows everything it holds."
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  app_links: ^7.2.2
  archive: ^4.5.0
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  cronet_http: ^1.10.0
  crypto: ^3.0.7
  cupertino_http: ^2.4.0
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.4
  http: ^1.6.0
  intl: any
  material_new_shapes: ^1.0.0
  material_symbols_icons: ^4.2960.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^9.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  two_dimensional_scrollables: ^0.5.5
  url_launcher: ^6.3.3
dependency_overrides:
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
    - assets/brand/oauth/
    - assets/settings/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # The stamp maker's pinned faces (`stamp-maker-font-sources.json`),
    # converted from the website's WOFF2 mirrors.
    - family: YurukaStd
      fonts:
        - asset: assets/stamp-fonts/YurukaStd.ttf
          weight: 900
    - family: SSFangTangTi
      fonts:
        - asset: assets/stamp-fonts/SSFangTangTi.ttf
