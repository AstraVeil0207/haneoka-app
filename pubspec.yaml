name: haneoka
description: "Reads your Our Notes save on every platform and shows everything it holds."
publish_to: 'none'
version: 0.1.3+38

environment:
  sdk: ^3.13.5

dependencies:
  vega_runtime_ffi:
    git:
      url: https://github.com/haneoka-gakuen/vega.git
      ref: 4aa5e3a76c540e142be75293d4d34463c138f3d0
      path: packages/runtime-ffi/dart
  vega_plugin_cubism:
    git:
      url: https://github.com/haneoka-gakuen/vega-plugin-cubism.git
      ref: fd4ff01be937c9ca478fede6a21723ec7686a508
      path: dart
  render_contracts:
    git:
      url: https://github.com/haneoka-gakuen/render-kernel-flutter.git
      ref: d810428b8719d083ab97dda77dc3ce7de0ace444
      path: packages/render_contracts
  render_kernel_flutter:
    git:
      url: https://github.com/haneoka-gakuen/render-kernel-flutter.git
      ref: d810428b8719d083ab97dda77dc3ce7de0ace444
  vega_renderer_flutter:
    git:
      url: https://github.com/haneoka-gakuen/vega-renderer-flutter.git
      ref: d8af06608a5c82c4465ab7ba9d11d1a0f7d32604
  cassiopeia_renderer_flutter:
    git:
      url: https://github.com/haneoka-gakuen/cassiopeia-renderer-flutter.git
      ref: 20d788de39ece115356073e0e15578ddd55d95b1
  cassiopeia_runtime:
    git:
      url: https://github.com/haneoka-gakuen/cassiopeia.git
      ref: cda415ba147285e4cdc320bea1f53258432c3f11
      path: dart
  vega_protocol:
    git:
      url: https://github.com/haneoka-gakuen/vega.git
      ref: 4aa5e3a76c540e142be75293d4d34463c138f3d0
      path: packages/protocol/dart
  vega_plugin_haneoka:
    git:
      url: https://github.com/haneoka-gakuen/vega-plugin-haneoka.git
      ref: 6318f65bdef41df351f8a9b3d80b93083ca95d15
      path: dart
  cassiopeia_plugin_our_notes:
    git:
      url: https://github.com/haneoka-gakuen/cassiopeia-plugin-our-notes.git
      ref: da2860c975d14fa33e6d501d4d21bf974679421d
      path: dart
  flutter_gpu:
    sdk: flutter
  haneoka_render_profile:
    git:
      url: https://github.com/haneoka-gakuen/haneoka-render-profile.git
      ref: 63bf1dfb76e0cd609cc076560b0c6c47d0305a4a
  haneoka_render_profile_flutter:
    git:
      url: https://github.com/haneoka-gakuen/haneoka-render-profile.git
      ref: 216ac7024246719c2844bc4a90601263d12eec44
      path: flutter
  image: ^4.12.0
  ffi: ^2.2.0
  app_links: ^7.2.2
  archive: ^4.5.0
  audioplayers: ^6.8.1
  cached_network_image: ^4.0.4
  cronet_http: ^1.10.0
  crypto: ^3.0.7
  cupertino_http:
    git:
      url: https://github.com/dart-lang/http.git
      ref: 6e91ce3e73ab079114de3684367318287b08d893
      path: pkgs/cupertino_http
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.5
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_widget_from_html_core: ^0.17.4
  http: ^1.6.0
  intl: any
  material_new_shapes: ^1.0.0
  material_symbols_icons: ^4.2960.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  photo_view: ^0.15.0
  pointycastle: ^4.0.0
  shared_preferences: ^2.5.6
  sqlite3: ^3.7.0
  two_dimensional_scrollables: ^0.5.5
  url_launcher: ^6.3.3
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_soloud:
    git:
      url: https://github.com/haneoka-gakuen/flutter_soloud.git
      ref: 421afc8897576929b3b4812d9e29c31f0a900adc
  window_manager: ^0.5.2
dependency_overrides:
  media_kit_libs_windows_video:
    path: third_party/media_kit_libs_windows_video

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/brand/
    - assets/brand/oauth/
    - assets/settings/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    # The stamp maker's pinned faces (`stamp-maker-font-sources.json`),
    # converted from the website's WOFF2 mirrors.
    - family: YurukaStd
      fonts:
        - asset: assets/stamp-fonts/YurukaStd.ttf
          weight: 900
    - family: SSFangTangTi
      fonts:
        - asset: assets/stamp-fonts/SSFangTangTi.ttf

hooks:
  user_defines:
    flutter_soloud:
      prebuild_tag: v1.0.2
