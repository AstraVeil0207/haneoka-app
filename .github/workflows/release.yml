name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/android/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - run: flutter build apk --release --split-per-abi --dart-define=cronetHttpNoPlay=true
      - run: flutter build apk --release --dart-define=cronetHttpNoPlay=true
      - run: flutter build appbundle --release --dart-define=cronetHttpNoPlay=true
      - name: Collect
        run: |
          mkdir dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/haneoka-android.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp build/app/outputs/flutter-apk/app-$abi-release.apk dist/haneoka-android-$abi.apk
          done
          cp build/app/outputs/bundle/release/app-release.aab dist/haneoka-android.aab
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          # The 22.04 image ships libunwind-14-dev, which conflicts with
          # libunwind-dev that GStreamer's headers need.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libmpv-dev libsecret-1-dev libjsoncpp-dev libwebkit2gtk-4.0-dev libsoup-3.0-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release
      - run: |
          mkdir dist
          tar -C build/linux/x64/release/bundle -czf dist/haneoka-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/haneoka-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign
      - name: Collect
        run: |
          mkdir dist
          ditto -c -k --keepParent build/macos/Build/Products/Release/haneoka.app dist/haneoka-macos.zip
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/haneoka-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: dist/*

  release:
    needs: [android, linux, windows, apple]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "haneoka ${GITHUB_REF_NAME#v}" \
            --generate-notes
