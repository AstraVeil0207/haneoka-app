name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  rust:
    name: Rust native and WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy --locked --manifest-path native/team_engine/Cargo.toml --lib -- -D warnings
      - run: cargo build --release --locked --manifest-path native/team_engine/Cargo.toml
      - run: cargo build --release --locked --manifest-path native/team_engine/Cargo.toml --target wasm32-unknown-unknown
